<svg xmlns="http://www.w3.org/2000/svg" width="744" height="716" viewBox="0 0 744 716" role="img" aria-label="Projects card: JARVIS, shared working memory for AI coding agents; fci-project, an agent plugin that computes Brazil's FCI import-content form; CoffeeVerse, a full-stack coffee discovery app with 3D bean explorer and tasting journal">
<style>
.t { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 13px; fill: #1f2226; }
.b { font-weight: 700; }
.f { fill: #868990; }
.cm { fill: #868990; font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 12px; }
.vk { font-family: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "Noto Serif CJK JP", "Noto Serif JP", serif; font-size: 26px; font-weight: 600; fill: #1f2226; }
.ry-spin { animation: ry 14s linear infinite; }
@keyframes ry { 0% { transform: scaleX(1); } 12.5% { transform: scaleX(.707); } 25% { transform: scaleX(0); } 37.5% { transform: scaleX(-.707); } 50% { transform: scaleX(-1); } 62.5% { transform: scaleX(-.707); } 75% { transform: scaleX(0); } 87.5% { transform: scaleX(.707); } 100% { transform: scaleX(1); } }
.sun { opacity: .92; animation: breathe 6s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1); opacity: .92; } 50% { transform: scale(1.03); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .ry-spin, .sun { animation: none; } }
</style>
<defs>
  <filter id="sh" x="-5%" y="-5%" width="110%" height="115%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity=".22"/>
  </filter>
  <filter id="washi" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9 .06" numOctaves="3" seed="11" result="fib"/>
    <feColorMatrix in="fib" type="matrix" values="0 0 0 0 .55  0 0 0 0 .53  0 0 0 0 .48  0 0 0 .09 0" result="tint"/>
    <feComposite in="tint" in2="SourceGraphic" operator="in" result="tex"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tex"/></feMerge>
  </filter>
</defs>
<g transform="translate(22,22)">
  <rect width="700" height="672" rx="3" fill="#fafaf8" filter="url(#sh)"/>
  <rect width="700" height="672" rx="3" fill="#fafaf8" filter="url(#washi)"/>
  <g transform="translate(92,248)"><circle class="sun" r="19" fill="#c8302b"/><g class="ry" transform="scale(.76)"><g class="ry-spin"><circle r="46" pathLength="300" transform="rotate(-20)" fill="none" stroke="#1f2226" stroke-width="5" stroke-linecap="round" stroke-dasharray="285" stroke-dashoffset="18" opacity=".88"/><circle r="48" pathLength="300" transform="rotate(35)" fill="none" stroke="#1f2226" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="295" stroke-dashoffset="8" opacity=".32"/></g></g></g>
<text x="92" y="340" class="vk" text-anchor="middle" dominant-baseline="central">個</text>
<text x="92" y="376" class="vk" text-anchor="middle" dominant-baseline="central">人</text>
<text x="92" y="412" class="vk" text-anchor="middle" dominant-baseline="central">開</text>
<text x="92" y="448" class="vk" text-anchor="middle" dominant-baseline="central">発</text>
  <line x1="172" x2="172" y1="28" y2="644" stroke="#d9d8d3" stroke-width="1"/>
  <text x="358" y="64" class="cm"># 個人開発</text>
<text x="208" y="64" class="t" xml:space="preserve"><tspan class="b">projects</tspan><tspan class="f">:</tspan></text>
<text x="208" y="84" class="t" xml:space="preserve"><tspan>  </tspan><tspan class="f">- </tspan><tspan class="b">name</tspan><tspan class="f">: </tspan><tspan>jarvis</tspan></text>
<text x="208" y="104" class="t" xml:space="preserve"><tspan>    </tspan><tspan class="b">what</tspan><tspan class="f">: |</tspan></text>
<text x="208" y="124" class="t" xml:space="preserve"><tspan>      </tspan><tspan>Shared working memory for AI coding agents.</tspan></text>
<text x="208" y="144" class="t" xml:space="preserve"><tspan>      </tspan><tspan>Claude Code, Codex and opencode read and write</tspan></text>
<text x="208" y="164" class="t" xml:space="preserve"><tspan>      </tspan><tspan>one store instead of four empty ones: a local</tspan></text>
<text x="208" y="184" class="t" xml:space="preserve"><tspan>      </tspan><tspan>daemon over SQLite, served over HTTP and MCP,</tspan></text>
<text x="208" y="204" class="t" xml:space="preserve"><tspan>      </tspan><tspan>plus a structural code graph per repository.</tspan></text>
<text x="208" y="224" class="t" xml:space="preserve"><tspan>    </tspan><tspan class="b">stack</tspan><tspan class="f">:  [</tspan><tspan>python, fastapi, sqlite, mcp</tspan><tspan class="f">]</tspan></text>
<text x="208" y="244" class="t" xml:space="preserve"><tspan>    </tspan><tspan class="b">status</tspan><tspan class="f">: </tspan><tspan>private, in production since 2025</tspan></text>
<text x="208" y="284" class="t" xml:space="preserve"><tspan>  </tspan><tspan class="f">- </tspan><tspan class="b">name</tspan><tspan class="f">: </tspan><tspan>fci-project</tspan></text>
<text x="208" y="304" class="t" xml:space="preserve"><tspan>    </tspan><tspan class="b">what</tspan><tspan class="f">: |</tspan></text>
<text x="208" y="324" class="t" xml:space="preserve"><tspan>      </tspan><tspan>Agent plugin that computes Brazil's FCI, the</tspan></text>
<text x="208" y="344" class="t" xml:space="preserve"><tspan>      </tspan><tspan>import-content form: from the monthly ZIP of</tspan></text>
<text x="208" y="364" class="t" xml:space="preserve"><tspan>      </tspan><tspan>NF-e XMLs and EFD files to six scenarios, the</tspan></text>
<text x="208" y="384" class="t" xml:space="preserve"><tspan>      </tspan><tspan>result workbook and the 5020 blocks. A generic</tspan></text>
<text x="208" y="404" class="t" xml:space="preserve"><tspan>      </tspan><tspan>engine for Claude Code, Codex and opencode.</tspan></text>
<text x="208" y="424" class="t" xml:space="preserve"><tspan>    </tspan><tspan class="b">stack</tspan><tspan class="f">:  [</tspan><tspan>python, pandas, pyarrow, openpyxl</tspan><tspan class="f">]</tspan></text>
<text x="208" y="444" class="t" xml:space="preserve"><tspan>    </tspan><tspan class="b">status</tspan><tspan class="f">: </tspan><tspan>private, in production since 2026</tspan></text>
<text x="208" y="484" class="t" xml:space="preserve"><tspan>  </tspan><tspan class="f">- </tspan><tspan class="b">name</tspan><tspan class="f">: </tspan><tspan>coffeeverse</tspan></text>
<text x="208" y="504" class="t" xml:space="preserve"><tspan>    </tspan><tspan class="b">what</tspan><tspan class="f">: |</tspan></text>
<text x="208" y="524" class="t" xml:space="preserve"><tspan>      </tspan><tspan>Full-stack coffee discovery app: inspect beans</tspan></text>
<text x="208" y="544" class="t" xml:space="preserve"><tspan>      </tspan><tspan>in 3D, log brews in a tasting journal, save</tspan></text>
<text x="208" y="564" class="t" xml:space="preserve"><tspan>      </tspan><tspan>your gear, and get picks from an AI coffee</tspan></text>
<text x="208" y="584" class="t" xml:space="preserve"><tspan>      </tspan><tspan>advisor built on Claude (next phase).</tspan></text>
<text x="208" y="604" class="t" xml:space="preserve"><tspan>    </tspan><tspan class="b">stack</tspan><tspan class="f">:  [</tspan><tspan>next.js, nestjs, prisma, postgres, three.js</tspan><tspan class="f">]</tspan></text>
<text x="208" y="624" class="t" xml:space="preserve"><tspan>    </tspan><tspan class="b">status</tspan><tspan class="f">: </tspan><tspan>live at coffeeverse.herickyk.workers.dev</tspan></text>
</g>
</svg>
