<svg xmlns="http://www.w3.org/2000/svg" width="744" height="336" viewBox="0 0 744 336" role="img" aria-label="Projects card: JARVIS, shared working memory for AI coding agents, built with Python, FastAPI, SQLite and MCP">
<style>
.t { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 13px; fill: #1f2226; }
.b { font-weight: 700; }
.f { fill: #868990; }
.cm { fill: #868990; font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, "Noto Sans CJK JP", "Noto Sans JP", sans-serif; font-size: 12px; }
.vk { font-family: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "Noto Serif CJK JP", "Noto Serif JP", serif; font-size: 26px; font-weight: 600; fill: #1f2226; }
</style>
<defs>
  <filter id="sh" x="-5%" y="-5%" width="110%" height="115%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity=".22"/>
  </filter>
  <filter id="washi" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9 .06" numOctaves="3" seed="11" result="fib"/>
    <feColorMatrix in="fib" type="matrix" values="0 0 0 0 .55  0 0 0 0 .53  0 0 0 0 .48  0 0 0 .09 0" result="tint"/>
    <feComposite in="tint" in2="SourceGraphic" operator="in" result="tex"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tex"/></feMerge>
  </filter>
</defs>
<g transform="translate(22,22)">
  <rect width="700" height="292" rx="3" fill="#fafaf8" filter="url(#sh)"/>
  <rect width="700" height="292" rx="3" fill="#fafaf8" filter="url(#washi)"/>
  <text x="92" y="128.0" class="vk" text-anchor="middle" dominant-baseline="central">作</text>
<text x="92" y="164.0" class="vk" text-anchor="middle" dominant-baseline="central">品</text>
  <line x1="172" x2="172" y1="28" y2="264" stroke="#d9d8d3" stroke-width="1"/>
  <text x="358" y="64" class="cm"># 作品</text>
<text x="208" y="64" class="t" xml:space="preserve"><tspan class="b">projects</tspan><tspan class="f">:</tspan></text>
<text x="208" y="84" class="t" xml:space="preserve"><tspan>  </tspan><tspan class="f">- </tspan><tspan class="b">name</tspan><tspan class="f">: </tspan><tspan>jarvis</tspan></text>
<text x="208" y="104" class="t" xml:space="preserve"><tspan>    </tspan><tspan class="b">what</tspan><tspan class="f">: |</tspan></text>
<text x="208" y="124" class="t" xml:space="preserve"><tspan>      </tspan><tspan>Shared working memory for AI coding agents.</tspan></text>
<text x="208" y="144" class="t" xml:space="preserve"><tspan>      </tspan><tspan>Claude Code, Codex and opencode read and write</tspan></text>
<text x="208" y="164" class="t" xml:space="preserve"><tspan>      </tspan><tspan>one store instead of four empty ones: a local</tspan></text>
<text x="208" y="184" class="t" xml:space="preserve"><tspan>      </tspan><tspan>daemon over SQLite, served over HTTP and MCP,</tspan></text>
<text x="208" y="204" class="t" xml:space="preserve"><tspan>      </tspan><tspan>plus a structural code graph per repository.</tspan></text>
<text x="208" y="224" class="t" xml:space="preserve"><tspan>    </tspan><tspan class="b">stack</tspan><tspan class="f">:  [</tspan><tspan>python, fastapi, sqlite, mcp</tspan><tspan class="f">]</tspan></text>
<text x="208" y="244" class="t" xml:space="preserve"><tspan>    </tspan><tspan class="b">status</tspan><tspan class="f">: </tspan><tspan>private, in daily use since 2026-09</tspan></text>
</g>
</svg>
