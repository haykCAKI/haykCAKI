  <radialGradient id="pond" cx="40%" cy="35%" r="80%"><stop offset="0" stop-color="#16324a"/><stop offset="1" stop-color="#0e1726"/></radialGradient>
  <clipPath id="card"><rect width="700" height="940" rx="3"/></clipPath>
</defs>
