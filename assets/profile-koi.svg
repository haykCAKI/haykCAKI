<svg xmlns="http://www.w3.org/2000/svg" width="744" height="984" viewBox="0 0 744 984" role="img" aria-label="Profile card for Herick Kumata on a night koi pond: about, career, stack and interests">
<style>
.ln { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 22px; font-weight: 650; letter-spacing: .2px; fill: #e6edf6; }
.role { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: #8fa0b8; }
.h { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2.2px; fill: #8cc6ef; }
.p, .v { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13.5px; fill: #d5deea; }
.hi { fill: #f0a070; font-weight: 600; }
.k { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; fill: #7f8ea6; font-variant-numeric: tabular-nums; }
.vl { font-family: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 600; fill: #dfe7f2; }
/* ensō: rotateY emulated with scaleX (orthographic), since 3D transforms are unreliable inside SVG */
.ry-spin { animation: ry 14s linear infinite; }
@keyframes ry { 0%, 100% { transform: scaleX(1); } 25% { transform: scaleX(0); } 50% { transform: scaleX(-1); } 75% { transform: scaleX(0); } }
.glow { transform-box: fill-box; transform-origin: center; animation: breathe 6s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
.ripple { transform-box: fill-box; transform-origin: center; animation: ripple 6s ease-out infinite; opacity: 0; }
@keyframes ripple { 0% { transform: scale(.08); opacity: .7; } 100% { transform: scale(1); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ry-spin, .glow, .ripple { animation: none; } .ripple { opacity: .4; } }
</style>
<defs>
  <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".55"/></filter>
