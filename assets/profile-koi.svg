<line x1="172" x2="172" y1="44" y2="904" stroke="#26344c" stroke-width="1"/>
<text x="208" y="80" class="ln">Herick Akio Yoshii Kumata</text>
<text x="208" y="106" class="role">Software &amp; data engineer · Paraná, Brazil</text>
<text x="208" y="152" class="h">ABOUT</text>
<text x="208" y="176" class="p">I build systems, pipelines and internal tools that turn raw,</text>
<text x="208" y="196" class="p">messy data into a clean, reliable and auditable base. Method</text>
<text x="208" y="216" class="p">comes before the tool: I map the inputs, rules and exceptions</text>
<text x="208" y="236" class="p">first, because organization is what makes automation useful.</text>
<text x="208" y="266" class="p">Day to day I work with accounting and tax data at an audit firm,</text>
<text x="208" y="286" class="p">where volume is high, every number must be traceable and there</text>
<text x="208" y="306" class="p">is little room for error. I build ETL pipelines over ledger and</text>
<text x="208" y="326" class="p">tax filings of up to 67 million records, outlier models that</text>
<text x="208" y="346" class="p">triage documents for audit review, and browser automation that</text>
<text x="208" y="366" class="p">removes manual steps.</text>
<text x="208" y="396" class="p">I also build AI skills, subagents and agents, backed by a shared</text>
<text x="208" y="416" class="p">knowledge graph, that make that work easier and more precise.</text>
<text x="208" y="446" class="p hi">Open to freelance work: automation, data engineering, web apps,</text>
<text x="208" y="466" class="p hi">AI integrations and custom internal tools.</text>
<text x="208" y="512" class="h">CAREER</text>
<text x="208" y="536" class="k">Now</text><text x="326" y="536" class="v">AI &amp; data engineering at an audit firm</text>
<text x="208" y="556" class="k">2024</text><text x="326" y="556" class="v">Software development intern, QQTech program</text>
<text x="208" y="576" class="k">Education</text><text x="326" y="576" class="v">Systems Analysis &amp; Development, PUCPR</text>
<text x="208" y="622" class="h">STACK</text>
<text x="208" y="646" class="k">Languages</text><text x="326" y="646" class="v">Python, TypeScript, JavaScript, SQL</text>
<text x="208" y="666" class="k">Web &amp; backend</text><text x="326" y="666" class="v">FastAPI, Node.js, React, Playwright</text>
<text x="208" y="686" class="k">Data</text><text x="326" y="686" class="v">PostgreSQL, Oracle, DuckDB, pandas, scikit-learn</text>
<text x="208" y="706" class="k">Cloud</text><text x="326" y="706" class="v">AWS, GCP, Cloudflare, Render, Docker, CI/CD</text>
<text x="208" y="726" class="k">AI</text><text x="326" y="726" class="v">Claude, OpenAI, agents, MCP, knowledge graphs, OCR</text>
<text x="208" y="746" class="k">Tools</text><text x="326" y="746" class="v">Excel, Google Sheets, Colab</text>
<text x="208" y="766" class="k">Domain</text><text x="326" y="766" class="v">Accounting, tax and audit</text>
<text x="208" y="812" class="h">OFF THE CLOCK</text>
<text x="208" y="836" class="k">Music</text><text x="326" y="836" class="v">Guitar</text>
<text x="208" y="856" class="k">Sports</text><text x="326" y="856" class="v">Calisthenics, running, Muay Thai</text>
<text x="208" y="876" class="k">Games</text><text x="326" y="876" class="v">CS2, Valorant, Overwatch, MMORPGs,</text>
