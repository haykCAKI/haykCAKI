    <g><animateMotion path="M30,40 C110,10 160,80 120,150 C80,220 10,170 30,40 Z" dur="26s" begin="0s" repeatCount="indefinite" rotate="auto"/><g transform="scale(1)"><path d="M-16,0 L-26,-7 L-23,0 L-26,7 Z" fill="#f2ece2" opacity=".85"/><ellipse rx="15" ry="5.5" fill="#f2ece2"/><ellipse cx="3" cy="-1" rx="4" ry="2.4" fill="#e0612f"/><path d="M-2,-4 L-7,-10 L-6,-3 Z M-2,4 L-7,10 L-6,3 Z" fill="#f2ece2" opacity=".7"/></g></g>
